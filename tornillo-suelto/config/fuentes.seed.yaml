# ATLAS — Catálogo semilla de fuentes
# Estado: seed_unverified. El agente `curador-fuentes` DEBE verificar feeds, acceso, robots.txt,
# exclusiones anti-IA y contrastar la clasificación con ≥2 fuentes de rating antes de marcar `verified`.
# Las etiquetas ideológicas son orientativas y RELATIVAS AL PAÍS (label_local). No son juicios de valor.
# Campos abreviados: t=type, tier, c=country, l=languages, bloc=region_bloc, st=state_relation, lab=ideology_label_local
# Valores de lab: left | center_left | center | center_right | right | heterodox | institutional | unknown
# Los feeds se autodescubren; aquí solo va el dominio.

defaults: {review_status: seed_unverified, active: true}

