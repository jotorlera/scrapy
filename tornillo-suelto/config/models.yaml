# ATLAS — Niveles de modelo (nunca escribir nombres de modelo a mano en el código).
# IDs y tarifas según la referencia de la API de Claude consultada el 2026-09-28. Verificar en docs.claude.com.
tiers:
  bulk:       # extracción, marcos, traducción, títulos neutros
    model: claude-haiku-4-5
    use_batch_api_when_not_urgent: true
    thinking: none
    max_tokens: 4096
  analysis:   # analistas, auditor, historiador, tutor, ensemble de pronóstico
    model: claude-sonnet-5
    thinking: adaptive
    effort: medium
    max_tokens: 8192
  synthesis:  # editor jefe, equipo rojo, filósofo, agregador de pronóstico
    model: claude-opus-5-5
    thinking: adaptive
    effort: medium
    max_tokens: 8192
prompt_caching: true
max_retries_on_schema_error: 1
# Salida cortada (stop_reason=max_tokens): un reintento con el doble de max_tokens, sin pasar de este tope.
max_tokens_retry_cap: 16000
# USD por millón de tokens (entrada, salida, lectura de caché, escritura de caché)
pricing_usd_per_mtok:
  claude-haiku-4-5:  {input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25}
  claude-sonnet-5:   {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-opus-5:     {input: 5.00, output: 25.00, cache_read: 0.50, cache_write: 6.25}
embeddings:
  model: BAAI/bge-m3      # opcional: ATLAS_EMBEDDINGS=bge-m3 (por defecto, hashing local sin descarga; ADR-0003)
  dim: 1024
  local: true
