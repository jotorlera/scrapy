[project]
name = "atlas-core"
version = "0.1.0"
description = "TORNILLO SUELTO · motor ATLAS — terminal personal de inteligencia (local-first)"
requires-python = ">=3.11"
license = { text = "Proprietary — personal use" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "anthropic>=1.0",
    "python-dateutil>=2.9",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "playwright>=1.45", "httpx>=0.27"]
embeddings = ["sentence-transformers>=3.0"]
extract = ["trafilatura>=1.9"]

[project.scripts]
atlas = "atlas_core.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "services/core" }

[tool.setuptools.packages.find]
where = ["services/core"]
include = ["atlas_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["services/core", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["services/core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
